name: Terraform apply on push to main

permissions:
    id-token: write
    contents: write
    checks: write
    pull-requests: read

on:
    push:
        branches: [main]

jobs:
    pre_commit:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Pre commit
              uses: ./.github/actions/pre_commit
              with:
                python_version: "3.10"

    dev:
        runs-on: ubuntu-latest
        needs: [pre_commit]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Terraform apply
              uses: ./.github/actions/run_terraform
              with:
                command: apply
                environment: dev
                tfc_token: $${{ secrets.TFC_TOKEN }}

